name: 改进建议
description: 提出配色、排版、兼容性或示例内容的改进。
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景
      description: 描述当前遇到的问题或希望支持的场景。
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: 建议的改进
      description: 可附参考图片或 LaTeX 示例。
    validations:
      required: true
