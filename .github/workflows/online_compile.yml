name: Build Beamer PDFs

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', '.github/ISSUE_TEMPLATE/**', '.github/PULL_REQUEST_TEMPLATE.md']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', '.github/ISSUE_TEMPLATE/**', '.github/PULL_REQUEST_TEMPLATE.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Compile starter and full guide
        uses: xu-cheng/latex-action@v4
        with:
          root_file: |
            template.tex
            slide.tex
          latexmk_use_xelatex: true
          texlive_version: '2026'
      - name: Check layout and fonts
        run: python3 .github/scripts/check_tex_logs.py template.log slide.log
      - name: Upload PDFs
        uses: actions/upload-artifact@v6
        with:
          name: HRBUST-ACM-ICPC-PDFs
          path: |
            template.pdf
            slide.pdf
          if-no-files-found: error
          retention-days: 30
