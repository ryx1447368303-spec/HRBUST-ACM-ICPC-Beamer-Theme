name: Build Release Packages

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Compile release PDFs
        uses: xu-cheng/latex-action@v4
        with:
          root_file: |
            template.tex
            slide.tex
          latexmk_use_xelatex: true
          texlive_version: '2026'
      - name: Check layout and fonts
        run: python3 .github/scripts/check_tex_logs.py template.log slide.log
      - name: Create release packages
        run: |
          python3 pack_overleaf.py
          python3 pack_overleaf.py --full --with-fonts --include-pdfs -o dist/HRBUST-ACM-ICPC-Theme.zip
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" \
            template.pdf slide.pdf \
            dist/HRBUST-ACM-ICPC-Theme.zip \
            dist/HRBUST-ACM-ICPC-Theme-overleaf.zip \
            --clobber
